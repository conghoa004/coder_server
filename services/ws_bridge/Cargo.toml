[package]
name = "wsb"
version = "0.2.0"
edition = "2021"
authors = ["conghoa004"]
description = "High-performance multi-protocol (TCP, UDP, HTTP, SOCKS5) tunnel bridge over WebSocket in Rust"
license = "MIT"

[[bin]]
name = "wsb"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots", "connect", "handshake"] }
tungstenite = { version = "0.24", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
clap = { version = "4.5", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1.0"
url = "2.5"
bytes = "1.6"
httparse = "1.9"
